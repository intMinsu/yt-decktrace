[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-decktrace"
version = "0.1.0"
description = "Turn YouTube presentations into timestamped slide and transcript bundles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2,<2",
  "imagehash>=4.3,<5",
  "pillow>=11,<13",
  "pysubs2>=1.8,<2",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'",
  "nvidia-cudnn-cu12==9.21.0.82; platform_system == 'Windows'",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
yt-decktrace = "yt_decktrace.cli:app"

[project.urls]
Repository = "https://github.com/intMinsu/yt-decktrace"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_decktrace"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "win-64",
  { platform = "osx-arm64", macos = "14.0" },
  "osx-64",
]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
yt-decktrace = { path = ".", editable = true }

[tool.pixi.feature.cuda]
platforms = ["win-64"]

[tool.pixi.tasks]
doctor = "python -m yt_decktrace doctor"
analyze = "python -m yt_decktrace analyze"
add-translation = "python -m yt_decktrace add-translation"
pack = "python -m yt_decktrace pack"
test = "python -m pytest"
lint = "python -m ruff check ."

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "cpu" }
cuda = { features = ["cuda", "dev"], solve-group = "cuda" }

[tool.ruff]
line-length = 100
target-version = "py312"
